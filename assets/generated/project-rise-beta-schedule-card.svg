<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141B2F"/>
      <stop offset="0.55" stop-color="#1D2750"/>
      <stop offset="1" stop-color="#221833"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7C948"/>
      <stop offset="1" stop-color="#FF7A45"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <style>
      text {
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
        dominant-baseline: middle;
      }
      .title { fill: #FFFFFF; font-size: 56px; font-weight: 800; letter-spacing: 0; }
      .subtitle { fill: #AEB9D8; font-size: 28px; font-weight: 500; letter-spacing: 0; }
      .label { fill: #F7C948; font-size: 34px; font-weight: 800; letter-spacing: 0; }
      .value { fill: #FFFFFF; font-size: 44px; font-weight: 800; letter-spacing: 0; }
      .note { fill: #CCD5EF; font-size: 30px; font-weight: 600; letter-spacing: 0; }
      .tag { fill: #151B2A; font-size: 22px; font-weight: 800; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="none"/>

  <g filter="url(#shadow)">
    <rect x="130" y="105" width="1340" height="690" rx="42" fill="url(#card)"/>
    <rect x="130" y="105" width="1340" height="690" rx="42" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
  </g>

  <rect x="130" y="105" width="1340" height="14" rx="7" fill="url(#accent)"/>

  <g transform="translate(190 185)">
    <rect x="0" y="0" width="186" height="44" rx="22" fill="url(#accent)"/>
    <text x="93" y="23" text-anchor="middle" class="tag">BETA TEST</text>
    <text x="0" y="104" class="title">Project R.I.S.E 测试信息</text>
    <text x="0" y="158" class="subtitle">报名通过后，留意邮箱里的 TestFlight 或 Google Play 邀请</text>
  </g>

  <g transform="translate(190 405)">
    <rect x="0" y="0" width="1220" height="106" rx="24" fill="#FFFFFF" fill-opacity="0.07"/>
    <rect x="0" y="0" width="6" height="106" rx="3" fill="#F7C948"/>
    <text x="42" y="53" class="label">测试时间</text>
    <text x="300" y="53" class="value">2026/08/19 07 - 2026/09/02 07 UTC</text>
  </g>

  <g transform="translate(190 535)">
    <rect x="0" y="0" width="1220" height="106" rx="24" fill="#FFFFFF" fill-opacity="0.07"/>
    <rect x="0" y="0" width="6" height="106" rx="3" fill="#FFB347"/>
    <text x="42" y="53" class="label">北京时间</text>
    <text x="300" y="53" class="value">2026/08/19 15 - 2026/09/02 15</text>
  </g>

  <g transform="translate(190 665)">
    <rect x="0" y="0" width="1220" height="106" rx="24" fill="#FFFFFF" fill-opacity="0.07"/>
    <rect x="0" y="0" width="6" height="106" rx="3" fill="#FF7A45"/>
    <text x="42" y="53" class="label">邀请发放</text>
    <text x="300" y="38" class="value">2026/08/19 15 起 12 小时内</text>
    <text x="300" y="80" class="note">邮箱接收 TestFlight / Google Play 邀请</text>
  </g>
</svg>
